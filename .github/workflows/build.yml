
name: Build Rasidi Smart APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare stable signing key
        shell: bash
        env:
          RASIDI_KEYSTORE_BASE64: ${{ secrets.RASIDI_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${RASIDI_KEYSTORE_BASE64:-}" ]; then
            echo "ERROR: Keystore secret is missing"
            exit 1
          fi

          printf '%s\n' "$RASIDI_KEYSTORE_BASE64" \
            | sed '/BEGIN CERTIFICATE/d; /END CERTIFICATE/d' \
            | tr -d '\r' \
            | base64 --decode > app/rasidi-release.jks

          if [ ! -s app/rasidi-release.jks ]; then
            echo "ERROR: Signing key file is empty"
            exit 1
          fi

          echo "Signing key prepared successfully"

      - name: Build signed Debug APK
        env:
          RASIDI_KEYSTORE_PASSWORD: ${{ secrets.RASIDI_KEYSTORE_PASSWORD }}
          RASIDI_KEY_ALIAS: ${{ secrets.RASIDI_KEY_ALIAS }}
          RASIDI_KEY_PASSWORD: ${{ secrets.RASIDI_KEY_PASSWORD }}
        run: gradle assembleDebug

      - name: Inspect APK signing certificate
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -1)

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found"
            exit 1
          fi

          "$APKSIGNER" verify --print-certs "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rasidi-Smart-APK
          path: app/build/outputs/apk/debug/app-debug.apk
